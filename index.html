<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetBehavior Reader | Premium Medical Research</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <nav class="glass-nav">
            <div class="logo">VetBehavior <span>Reader</span></div>
            <div class="nav-links">
                <a href="#" class="active">Search</a>
                <a href="#">Library</a>
            </div>
        </nav>

        <header class="hero">
            <h1>동물행동의학의 깊이를 더하다</h1>
            <p>매주 한 편의 논문으로 완성하는 전문성</p>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="교수님 성함 또는 키워드를 입력하세요">
                <button id="searchBtn">검색하기</button>
            </div>
        </header>

        <!-- Featured Discovery Section -->
        <section id="featuredSection" class="featured-section hidden">
            <div class="section-title">
                <span class="badge">Recommended</span>
                <h2>오늘의 추천 연구</h2>
                <p>동물행동의학 분야에서 가장 많이 인용된 권위 있는 연구를 소개합니다.</p>
            </div>
            <div id="featuredCardContainer">
                <!-- Featured card will be injected here -->
            </div>
        </section>

        <main id="resultsGrid" class="results-grid">
            <div class="empty-state">
                <p>궁금한 키워드를 검색하여 연구를 시작하세요.</p>
            </div>
        </main>

        <div id="readerOverlay" class="overlay hidden">
            <div class="overlay-content">
                <button id="closeReader" class="close-btn">&times;</button>
                <div class="reader-header">
                    <h2 id="readerTitle">논문 제목</h2>
                    <div class="reader-meta">
                        <span id="readerAuthors">저자 정보</span> • <span id="readerYear">연도</span>
                    </div>
                </div>
                <div class="reader-body">
                    <div class="column english">
                        <h3>Original Abstract</h3>
                        <div id="englishContent"></div>
                    </div>
                    <div class="column korean">
                        <h3>AI Medical Summary</h3>
                        <div id="koreanContent"></div>
                    </div>
                </div>
                <div class="reader-footer">
                    <button id="saveToObsidian" class="primary-btn">Obsidian에 저장</button>
                    <a id="pdfLink" href="#" target="_blank" class="secondary-btn">원본 PDF 보기</a>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
