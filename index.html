<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetBehavior Reader | Premium Research Discovery</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="logo-icon">🌿</span>
                <h1>VetBehavior <span>Reader</span></h1>
            </div>
            <p class="subtitle">동물행동의학 최신 연구를 가장 효율적으로 탐색하고 분석합니다.</p>
        </header>

        <main>
            <!-- 추천 논문 섹션 (Featured) -->
            <section id="featured-section" class="featured-container">
                <div class="section-header">
                    <span class="badge">오늘의 추천 연구</span>
                    <h2>Featured Discovery</h2>
                    <p>인용수가 높은 권위 있는 연구를 매일 한 편 추천합니다.</p>
                </div>
                <div id="featured-card-slot">
                    <div class="loading-shimmer">추천 연구를 불러오는 중...</div>
                </div>
            </section>

            <!-- 검색 섹션 -->
            <section class="search-section">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="관심 있는 행동의학 키워드를 입력하세요 (예: Separation Anxiety)">
                    <button id="search-button">
                        <span class="search-icon">🔍</span>
                        검색
                    </button>
                </div>
            </section>

            <!-- 결과 리스트 -->
            <section id="results-container" class="results-grid">
                <!-- 결과가 여기에 동적으로 생성됩니다 -->
            </section>
        </main>

        <!-- 리더 모드 오버레이 (Reader Overlay) -->
        <div id="reader-overlay" class="overlay hidden">
            <div class="overlay-content">
                <button class="close-overlay">×</button>
                <div id="reader-body">
                    <!-- 논문 내용이 여기에 로드됩니다 -->
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
